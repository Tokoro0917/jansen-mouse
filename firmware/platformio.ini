; テオヤンセン機構クラシックマウス ファームウェア
[platformio]
default_envs = blackpill_f411ce

[env]
build_flags = -Wall -Wextra
test_framework = unity

; 実機: STM32F411CEU6 (WeAct Black Pill)
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
  -Wl,-u,_printf_float
test_ignore = *

; PC 上での単体試験: pio test -e native
[env:native]
platform = native
build_flags = ${env.build_flags} -std=gnu++17
build_src_filter = -<*>
