name: CI

on:
  push:
  pull_request:

jobs:
  mechanism:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mechanism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: 生成物が最新か確認
        run: |
          python -m jansen.cli header -o ../firmware/include/mechanism_params.h
          python -m jansen.cli scad -o ../cad/links_generated.scad
          python -m jansen.cli report -o ../docs/jansen_report.md
          python -m jansen.cli assembly -o ../cad/assembly_generated.scad
          git diff --exit-code

  cad:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cad
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq openscad
      - name: 全部品と組立図がエラーなく生成できるか確認
        run: |
          for p in bar tri_upper tri_foot web web_motor frame coupler layout chassis motor_clamp sensor_holder; do
            openscad --hardwarnings -D "PART=\"$p\"" -o "/tmp/$p.stl" parts.scad
          done
          for p in deck_outline sensor_board_outline; do
            openscad --hardwarnings -D "PART=\"$p\"" -o "/tmp/$p.dxf" parts.scad
          done
          openscad --hardwarnings -o /tmp/assembly.stl assembly_generated.scad

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e blackpill_f411ce
